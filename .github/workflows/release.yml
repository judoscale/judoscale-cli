name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the binaries for a release that release-please just created and
  # attaches them to it.
  publish:
    name: Build and attach binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # GITHUB_TOKEN can't push to another repo, so the formula uses an app
      # token scoped to the tap.
      - uses: actions/create-github-app-token@v3.3.0
        id: tap
        with:
          client-id: ${{ vars.AUTOMATION_OSS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_OSS_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.tap.outputs.token }}
