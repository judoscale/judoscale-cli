name: Update spec

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Refresh embedded spec
    runs-on: ubuntu-latest
    steps:
      # An app token, unlike GITHUB_TOKEN, lets the PR trigger CI.
      - uses: actions/create-github-app-token@v3.3.0
        id: app
        with:
          client-id: ${{ vars.AUTOMATION_OSS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_OSS_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: script/update-spec
      - name: Open a PR if the spec changed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          [ -z "$(git status --porcelain internal/spec)" ] && exit 0
          branch=update-api-spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add internal/spec/openapi.json internal/spec/openapi.etag
          git commit -m "fix: update the embedded API spec"
          git push --force origin "$branch"

          body='Refreshed with `script/update-spec`.'
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --head "$branch" --body "$body" \
              --title "fix: update the embedded API spec"
          fi
