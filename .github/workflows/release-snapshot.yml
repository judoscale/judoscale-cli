name: Release snapshot

# Run manually to check the release build without releasing anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
